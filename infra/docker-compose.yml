version: "3.9"

networks:
  infinitymesh:
    name: infinitymesh-network
    driver: bridge

volumes:
  qdrant_data:
  grafana_data:
  prometheus_data:
  loki_data:

services:

  nats:
    image: nats:latest
    container_name: infinitymesh-nats
    ports:
      - "4222:4222"
    restart: unless-stopped
    networks: [infinitymesh]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: infinitymesh-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks: [infinitymesh]

  redis:
    image: redis:latest
    container_name: infinitymesh-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks: [infinitymesh]

  prometheus:
    image: prom/prometheus
    container_name: infinitymesh-prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks: [infinitymesh]

  grafana:
    image: grafana/grafana
    container_name: infinitymesh-grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks: [infinitymesh]

  loki:
    image: grafana/loki:latest
    container_name: infinitymesh-loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks: [infinitymesh]


